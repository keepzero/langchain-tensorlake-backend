[project]
name = "langchain-tensorlake-backend"
version = "0.1.0"
description = "Tensorlake Cloud Volume filesystem backend for LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["langchain", "deepagents", "tensorlake", "filesystem"]
dependencies = [
    "deepagents>=0.7.13,<0.8",
    "tensorlake>=0.5.151,<0.6",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.7,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["integration: requires a real Tensorlake project"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
